<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Connecting CrowdQuest to Twitch…</title><style>body{margin:0;background:#151a15;color:#f2f2eb;font:15px system-ui;display:grid;place-items:center;min-height:100vh}.card{max-width:390px;margin:20px;padding:30px;background:#20271f;border:1px solid #46503c;border-radius:14px}.mark{color:#d2ef9a;font-size:28px}.small{color:#b3bcab;font-size:13px;line-height:1.6}</style></head><body><div class="card"><div class="mark">◈ &nbsp; CrowdQuest</div><p id="message" class="small">Finishing Twitch authorization…</p></div><script>const message=document.getElementById('message');if(window.opener&&!window.opener.closed){const values=new URLSearchParams(location.hash.slice(1));const query=new URLSearchParams(location.search);window.opener.postMessage({type:'crowdquest-twitch-oauth',state:values.get('state')||query.get('state'),token:values.get('access_token'),error:query.get('error_description')||query.get('error')||null},location.origin);message.textContent='You can close this window and return to CrowdQuest.';setTimeout(()=>window.close(),700)}else{message.textContent='Open this page from the CrowdQuest dashboard to finish connecting.'}</script></body></html>
